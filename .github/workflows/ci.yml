name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      full_ui:
        description: Run the full desktop E2E suite instead of only smoke tests
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-and-test:
    name: Build and functional tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            runtime: win-x64
          - runner: windows-11-arm
            arch: arm64
            runtime: win-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore FastEdit.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests\FastEdit.UiTests\FastEdit.UiTests.csproj

      - name: Build application and all test projects
        run: |
          dotnet build FastEdit.sln --no-restore --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests\FastEdit.UiTests\FastEdit.UiTests.csproj --no-restore --configuration Release

      - name: Run unit and functional tests
        run: >-
          dotnet test tests\FastEdit.Tests\FastEdit.Tests.csproj
          --no-build --no-restore --configuration Release
          --verbosity minimal
          --logger "trx;LogFileName=unit.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults\unit
          --blame-hang --blame-hang-timeout 2m

      - name: Publish the application for desktop testing
        run: >-
          dotnet publish src\FastEdit\FastEdit.csproj
          --configuration Release --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          --output artifacts\app

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.arch }}
          path: artifacts\app
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload desktop test runner
        uses: actions/upload-artifact@v7
        with:
          name: ui-tests-${{ matrix.arch }}
          path: tests\FastEdit.UiTests\bin\Release\net8.0-windows
          if-no-files-found: error
          retention-days: 7

      - name: Upload functional results and coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: functional-results-${{ matrix.arch }}
          path: TestResults
          retention-days: 7

  desktop-tests:
    name: Desktop UI tests (${{ matrix.arch }})
    needs: build-and-test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      FASTEDIT_UI_TESTS: '1'
      FASTEDIT_UI_APP: ${{ github.workspace }}\app\FastEdit.exe
      FASTEDIT_UI_ARTIFACTS: ${{ github.workspace }}\TestResults\desktop
      FASTEDIT_UI_SUITE: ${{ (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full_ui)) && 'full' || 'smoke' }}
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: app-${{ matrix.arch }}
          path: app

      - uses: actions/download-artifact@v8
        with:
          name: ui-tests-${{ matrix.arch }}
          path: ui-tests

      - name: Run desktop tests against the published application
        run: |
          $arguments = @(
            '.\ui-tests\FastEdit.UiTests.dll',
            '--logger:trx;LogFileName=desktop.trx',
            '--ResultsDirectory:TestResults\desktop',
            '--Blame:CollectHangDump;TestTimeout=2m;HangDumpType=mini'
          )
          if ($env:FASTEDIT_UI_SUITE -eq 'smoke') {
            $arguments += '--TestCaseFilter:Category=Smoke'
          }
          dotnet vstest @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$results = Get-Content TestResults\desktop\desktop.trx -Raw
          $counters = $results.TestRun.ResultSummary.Counters
          if ([int]$counters.total -eq 0 -or [int]$counters.passed -ne [int]$counters.total) {
            throw "Desktop tests must execute and pass; skipped or missing tests are not a success."
          }
          "### Desktop tests (${{ matrix.arch }})`nSuite: $env:FASTEDIT_UI_SUITE; passed: $($counters.passed)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload desktop reports, screenshots, UI trees and application logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-results-${{ matrix.arch }}
          path: TestResults
          include-hidden-files: true
          retention-days: 7

  package:
    name: Package tested binaries
    needs: [build-and-test, desktop-tests]
    if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: app-x64
          path: deploy\output\publish-x64

      - uses: actions/download-artifact@v8
        with:
          name: app-arm64
          path: deploy\output\publish-arm64

      - name: Ensure NSIS is installed
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') -and
              !(Test-Path 'C:\Program Files\NSIS\makensis.exe')) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed." }
          }

      - name: Package without rebuilding or changing the version
        run: |
          $version = "1.1.$((Get-Content build.counter -Raw).Trim())"
          .\deploy\build.ps1 -Version $version -PackageOnly

      - uses: actions/upload-artifact@v7
        with:
          name: packages-unsigned
          path: |
            deploy\output\*.zip
            deploy\output\*-setup.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Sign and publish tested release
    needs: [build-and-test, desktop-tests]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate the release tag against the tracked version
        id: version
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must have the form v1.1.18."
          }
          $version = $Matches[1]
          $expected = "1.1.$((Get-Content build.counter -Raw).Trim())"
          if ($version -ne $expected) {
            throw "Tag version '$version' does not match build.counter ('$expected')."
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          name: app-x64
          path: deploy\output\publish-x64

      - uses: actions/download-artifact@v8
        with:
          name: app-arm64
          path: deploy\output\publish-arm64

      - name: Import the release signing certificate
        id: signing
        env:
          SIGNING_PFX: ${{ secrets.FASTEDIT_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.FASTEDIT_SIGNING_PFX_PASSWORD }}
        run: |
          if (!$env:SIGNING_PFX -or !$env:SIGNING_PASSWORD) {
            throw "Configure FASTEDIT_SIGNING_PFX_BASE64 and FASTEDIT_SIGNING_PFX_PASSWORD in the release environment. CI will not generate a replacement certificate."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'FastEdit-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX))
            $password = ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $pfxPath -Password $password -CertStoreLocation Cert:\CurrentUser\My)
            $signers = @($certificates | Where-Object {
              $_.HasPrivateKey -and $_.NotBefore -le (Get-Date) -and $_.NotAfter -gt (Get-Date) -and
              $_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.3'
            })
            if ($signers.Count -ne 1) { throw "Expected exactly one valid code-signing certificate with a private key." }
            "thumbprint=$($signers[0].Thumbprint)" >> $env:GITHUB_OUTPUT
          }
          finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath }
          }

      - name: Ensure NSIS is installed
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') -and
              !(Test-Path 'C:\Program Files\NSIS\makensis.exe')) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed." }
          }

      - name: Sign and package without rebuilding
        run: >-
          .\deploy\build.ps1 -Version '${{ steps.version.outputs.value }}'
          -PackageOnly -Sign -CertificateThumbprint '${{ steps.signing.outputs.thumbprint }}'

      - name: Verify signatures
        run: |
          $certificate = '.\deploy\output\FastEdit-SelfSigned.cer'
          Import-Certificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Import-Certificate -FilePath $certificate -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null
          $files = @(
            '.\deploy\output\publish-x64\FastEdit.exe',
            '.\deploy\output\publish-arm64\FastEdit.exe',
            '.\deploy\output\FastEdit-${{ steps.version.outputs.value }}-x64-setup.exe',
            '.\deploy\output\FastEdit-${{ steps.version.outputs.value }}-arm64-setup.exe'
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Thumbprint -ne '${{ steps.signing.outputs.thumbprint }}') {
              throw "Signature verification failed for $file."
            }
          }

      - name: Publish the signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $assets = @(
            ".\deploy\output\FastEdit-$version-x64-portable.zip",
            ".\deploy\output\FastEdit-$version-arm64-portable.zip",
            ".\deploy\output\FastEdit-$version-x64-setup.exe",
            ".\deploy\output\FastEdit-$version-arm64-setup.exe",
            '.\deploy\output\FastEdit-SelfSigned.cer'
          )
          $notes = "Signed x64 and arm64 installers and portable packages. Certificate thumbprint: ${{ steps.signing.outputs.thumbprint }}. Build, functional and full desktop E2E results: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title "FastEdit $version" --generate-notes --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Release creation or asset upload failed." }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed; the draft has been retained." }
